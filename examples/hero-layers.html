<!-- CMSのヒーローHTML差し替え用。画像は images/top-hero/ に保存します。 -->
<div class="hex-hero-wrap">
  <div class="hex-hero-sticky">
    <section class="hex-hero">
      <div class="hex-cloud-layer" aria-hidden="true">
        <img class="hex-cloud hex-cloud--1 hex-cloud--behind-ellipse" src="left_cloud01.svg" alt="">
        <img class="hex-cloud hex-cloud--2 hex-cloud--behind-ellipse" src="left_cloud02.svg" alt="">
        <img class="hex-cloud hex-cloud--3 hex-cloud--in-front-of-ellipse" src="left_cloud03.svg" alt="">
        <img class="hex-cloud hex-cloud--4 hex-cloud--behind-ellipse" src="right_cloud01.svg" alt="">
        <img class="hex-cloud hex-cloud--5 hex-cloud--behind-ellipse" src="right_cloud02.svg" alt="">
        <img class="hex-cloud hex-cloud--6 hex-cloud--in-front-of-ellipse" src="right_cloud03.svg" alt="">
      </div>
      <div class="hex-hero-ellipse" aria-hidden="true" style="background-image:url('ellipse.png')"></div>

      <!-- 奥から手前へ。HTMLの記載順が合成順になります。 -->
      <div class="hex-hero-scene">
        <!-- 01 台座：全画像の基準サイズ -->
        <div class="hex-hero-bg"><img class="hex-hero-plinth-image" src="plinth.png" alt=""></div>
        <!-- 02 図面：台座と同じ画像サイズ・構図 -->
        <img class="hex-hero-layer hex-hero-drawing" src="drawing.png" alt="">
        <!-- 03・04 樹木1・下草1：位置とサイズを個別指定 -->
        <img class="hex-hero-sprite hex-hero-sprite--tree01" src="tree01.png" alt="">
        <img class="hex-hero-sprite hex-hero-sprite--underplant01" src="underplant01.png" alt="">
        <!-- 05・06 建物・外構：台座と同じ画像サイズ・構図 -->
        <img class="hex-hero-layer hex-hero-house" src="house.png" alt="">
        <img class="hex-hero-layer hex-hero-exterior-image" src="exterior.png" alt="">
        <!-- 07～10 樹木2・下草2・樹木3・下草3 -->
        <img class="hex-hero-sprite hex-hero-sprite--tree02" src="tree02.png" alt="">
        <img class="hex-hero-sprite hex-hero-sprite--underplant02" src="underplant02.png" alt="">
        <img class="hex-hero-sprite hex-hero-sprite--tree03" src="tree03.png" alt="">
        <img class="hex-hero-sprite hex-hero-sprite--underplant03" src="underplant03.png" alt="">
        <!-- 11～16 人物：位置とサイズを個別指定 -->
        <img class="hex-hero-character hex-hero-character--aluminum" src="aluminum.png" alt="">
        <img class="hex-hero-character hex-hero-character--pruning" src="pruning.png" alt="">
        <img class="hex-hero-character hex-hero-character--sakan" src="sakan.png" alt="">
        <img class="hex-hero-character hex-hero-character--block" src="block.png" alt="">
        <img class="hex-hero-character hex-hero-character--supervisor" src="supervisor.png" alt="">
        <img class="hex-hero-character hex-hero-character--family" src="family.png" alt="">
      </div>

      <div class="hex-hero-bottom-illustrations" aria-hidden="true">
        <img class="hex-hero-bottom-img hex-hero-bottom-img--l1" src="left_bottom01.webp" alt="">
        <img class="hex-hero-bottom-img hex-hero-bottom-img--l2" src="left_bottom02.webp" alt="">
        <img class="hex-hero-bottom-img hex-hero-bottom-img--l3" src="left_bottom03.webp" alt="">
        <img class="hex-hero-bottom-img hex-hero-bottom-img--r1" src="right_bottom01.webp" alt="">
        <img class="hex-hero-bottom-img hex-hero-bottom-img--r2" src="right_bottom02.webp" alt="">
        <img class="hex-hero-bottom-img hex-hero-bottom-img--r3" src="right_bottom03.webp" alt="">
      </div>
    </section>
    <div class="hex-hero-catch">
      <div class="hex-handoff-copy">
        <span class="hex-opening-main">Build Your Everyday</span>
        <span class="hex-opening-sub">住宅廻りに、快適さを</span>
      </div>
    </div>
  </div>
</div>
